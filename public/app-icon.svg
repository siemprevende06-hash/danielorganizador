<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Outer ring -->
  <rect x="32" y="32" width="448" height="448" rx="72" ry="72" fill="none" stroke="#3b82f6" stroke-width="12" opacity="0.6"/>
  <!-- Checkmark circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#3b82f6" stroke-width="16"/>
  <!-- Checkmark -->
  <polyline points="180,260 235,315 340,200" fill="none" stroke="#3b82f6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
